[project]
name = "rybakina3d"
version = "0.1.0"
description = "Broadcast tennis footage + reference photos -> stylized, rigged game character with a moveset that moves like the athlete."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
# Runs on the workstation: hosted model APIs, shot detection, asset prep, site build.
api = [
  "google-genai>=1.30",
  "fal-client>=0.7",
  "requests>=2.31",
  "pymupdf>=1.24",
  "pillow>=10",
  "scenedetect[opencv]>=0.6.4",
  "librosa>=0.10",
  "python-dotenv>=1.0",
]
# Runs on the GPU host (installed by scripts/setup_gpu.sh, which pins torch for the driver).
gpu = [
  "gvhmr[preproc]==1.6.1",
  "ultralytics>=8.3",
  "scenedetect[opencv]>=0.6.4",
  "librosa>=0.10",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
r3d = "rybakina3d.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rybakina3d"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# model prompts are prose: keep them readable rather than wrapped at the code width
"src/rybakina3d/index/labeler.py" = ["E501"]
"src/rybakina3d/character/stylize.py" = ["E501"]
